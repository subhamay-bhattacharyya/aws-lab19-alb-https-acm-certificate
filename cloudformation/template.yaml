AWSTemplateFormatVersion: '2010-09-09'

Description: |
  Root CloudFormation template for AWS Networking Lab 16. Creates:
  - VPC and Internet Gateway (Vpc)
  - Public subnets with a default route to the Internet Gateway 
  - Private subnets without a default route
  - HTTP security group open to 0.0.0.0/0 
  - Web server security group, HTTP from AppLoadBalancerSg only
  - Ingress rule allowing HTTP from AppLoadBalancerSg to WebServerSg 
  - Private SSH security group 

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: "Project Configuration"
        Parameters:
          - Project
          - Environment
      - Label:
          default: "Nested Stack Configuration"
        Parameters:
          - TemplateBucket
      - Label:
          default: "VPC Configuration"
        Parameters:
          - VpcCidr
          - PublicCidrs
          - PrivateCidrs
      - Label:
          default: "Security Group Configuration"
        Parameters:
          - AppLoadBalancerSgName
          - WebServerSgName
      # - Label:
      #     default: "EC2 Instance Configuration"
      #   Parameters:
      #     - AmiParam
      #     - InstanceType
      #     - KeyName
      - Label:
          default: "Advanced Configuration"
        Parameters:
          - CiSuffix
    ParameterLabels:
      TemplateBucket:
        default: "S3 Bucket Name"
      Project:
        default: "Project Name"
      Environment:
        default: "Environment"
      VpcCidr:
        default: "VPC CIDR block (e.g., 10.0.0.0/16)"
      PublicCidrs:
        default: "Public Subnet CIDR blocks (comma-separated, e.g., 10.10.0.0/20)"
      PrivateCidrs:
        default: "Private Subnet CIDR blocks (comma-separated, e.g., 10.10.0.0/20)"
      AppLoadBalancerSgName:
        default: "HTTP Only Security Group Public Subnet Base Name"
      WebServerSgName:
        default: "Web Server Security Group Private Subnet Base Name"
      # AmiParam:
      #   default: "EC2 Image (AMI) SSM Parameter"
      # InstanceType:
      #   default: "EC2 Instance Type"
      # KeyName:
      #   default: "EC2 Key Pair Name (for SSH)"
      CiSuffix:
        default: "CI CiSuffix"

Parameters:
  TemplateBucket:
    Type: String
    Default: "subhamay-cfn-templates-bucket-270453428528-us-east-1"
    Description: "S3 bucket name where the nested CloudFormation template is stored"
    MinLength: 3
    MaxLength: 63
    AllowedPattern: "^[a-z0-9][a-z0-9.-]*[a-z0-9]$"
    ConstraintDescription: "S3 bucket name must be 3-63 characters, start and end with lowercase letter or number, and can contain hyphens and dots"

  Project:
    Type: String
    Default: "netwk-lab19"
    Description: "Project name to use as a bucket prefix"
    MinLength: 1
    MaxLength: 20
    AllowedPattern: "^[a-z0-9-]+$"
    ConstraintDescription: "Project name must be lowercase letters, numbers, and hyphens only"

  Environment:
    Type: String
    Default: devl
    Description: "Deployment environment"
    AllowedValues:
      - devl
      - stag
      - prod
    ConstraintDescription: "Environment must be one of: devl, stag, prod"

  VpcCidr:
    Type: String
    Default: '10.12.0.0/16'
    Description: CIDR block for the VPC (e.g., 10.0.0.0/16)
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$'
    ConstraintDescription: Must be valid CIDR block

  PublicCidrs:
    Type: String
    Default: "10.12.0.0/20,10.12.16.0/20"
    Description: "Comma-separated list of public subnet CIDR blocks (e.g., 10.10.0.0/20)"
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/\d{1,2}(,\s*(\d{1,3}\.){3}\d{1,3}/\d{1,2})*$'
    ConstraintDescription: "Must be valid CIDR blocks, comma-separated"

  PrivateCidrs:
    Type: String
    Default: "10.12.48.0/20,10.12.64.0/20"
    Description: "Comma-separated list of private subnet CIDR blocks (e.g., 10.10.16.0/20)"
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/\d{1,2}(,\s*(\d{1,3}\.){3}\d{1,3}/\d{1,2})*$'
    ConstraintDescription: "Must be valid CIDR blocks, comma-separated"

  CiSuffix:
    Type: String
    Default: ""
    Description: "Optional CI suffix to append to the bucket name"

  AppLoadBalancerSgName:
    Type: String
    Default: "alb-public-sg"
    Description: "Base name for the HTTP-only security group in the public subnet, combined with the project and environment names"
    MinLength: 1
    MaxLength: 30
    AllowedPattern: "^[a-z0-9-]+$"
    ConstraintDescription: "Security group base name must be lowercase letters, numbers, and hyphens only"

  WebServerSgName:
    Type: String
    Default: "web-server-sg"
    Description: "Base name for the web server security group in the private subnet, combined with the project and environment names"
    MinLength: 1
    MaxLength: 30
    AllowedPattern: "^[a-z0-9-]+$"
    ConstraintDescription: "Security group base name must be lowercase letters, numbers, and hyphens only"

  # AmiParam:
  #   Type: String
  #   Default: "/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64"
  #   Description: "SSM parameter that resolves to the EC2 image (AMI) ID for the instance. The default resolves to the latest Amazon Linux 2023 x86_64 AMI in the deployment region"

  # InstanceType:
  #   Type: String
  #   Default: "t3.micro"
  #   AllowedValues:
  #     - t3.micro
  #     - t3.small
  #     - t3.medium
  #     - t2.micro
  #   Description: "EC2 instance type"
  #   ConstraintDescription: "Must be one of the allowed instance types"

  # KeyName:
  #   Type: String
  #   Default: "networking-lab"
  #   Description: "Name of an existing EC2 key pair to use for SSH access. The console lists the key pairs available in this account and region"
  #   ConstraintDescription: "Must be the name of an existing EC2 key pair in this account and region"


Conditions:
  HasSuffix: !Not [!Equals [!Ref CiSuffix, ""]]

Resources:

  # VPC and Internet Gateway
  Vpc:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TemplateURL: !Sub "https://${TemplateBucket}.s3.us-east-1.amazonaws.com/cfn-nested-aws-vpc/template.yaml"
      Parameters:
          VPCCidrBlock: !Ref VpcCidr
          EnableDnsHostnames: "true"
          EnableInternetGateway: "true"
          VpcNameTag: !If
            - HasSuffix
            - !Sub "${Project}-${Environment}-${AWS::Region}-${CiSuffix}"
            - !Sub "${Project}-${Environment}-${AWS::Region}"
          Environment: !Ref Environment
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: "Implement VPC with single public subnet and EC2 SSH"
        - Key: Component
          Value: NetworkingVPC
        - Key: ManagedBy
          Value: RootStack
      TimeoutInMinutes: 10

  # Public subnet with a default route to the Internet Gateway
  PublicSubnets:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TemplateURL: !Sub "https://${TemplateBucket}.s3.us-east-1.amazonaws.com/cfn-nested-aws-subnets/template.yaml"
      Parameters:
        VpcId: !GetAtt Vpc.Outputs.VPCId
        VpcName: !If
          - HasSuffix
          - !Sub "${Project}-${Environment}-${CiSuffix}"
          - !Sub "${Project}-${Environment}"
        AvailabilityZones: "us-east-1a,us-east-1b"
        SubnetCidrBlocks: !Ref PublicCidrs
        SubnetCount: "2"
        SubnetQualifier: "public"
        InternetGatewayId: !GetAtt Vpc.Outputs.InternetGatewayId
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: "Implement VPC with single public subnet and EC2 SSH"
        - Key: Component
          Value: PublicSubnetsNestedStack
        - Key: ManagedBy
          Value: RootStack
      TimeoutInMinutes: 10

  # Private subnet. No Internet Gateway is passed, so the subnet has no default route
  PrivateSubnets:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TemplateURL: !Sub "https://${TemplateBucket}.s3.us-east-1.amazonaws.com/cfn-nested-aws-subnets/template.yaml"
      Parameters:
        VpcId: !GetAtt Vpc.Outputs.VPCId
        VpcName: !If
          - HasSuffix
          - !Sub "${Project}-${Environment}-${CiSuffix}"
          - !Sub "${Project}-${Environment}"
        AvailabilityZones: "us-east-1a,us-east-1b"
        NatPublicSubnetIds: !GetAtt PublicSubnets.Outputs.SubnetId2
        SubnetCidrBlocks: !Ref PrivateCidrs
        SubnetCount: "2"
        SubnetQualifier: "private"
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: "Implement VPC with single public subnet and EC2 SSH"
        - Key: Component
          Value: PrivateSubnetsNestedStack
        - Key: ManagedBy
          Value: RootStack
      TimeoutInMinutes: 10

  # HTTP-only security group, open to 0.0.0.0/0
  AppLoadBalancerSg:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TemplateURL: !Sub "https://${TemplateBucket}.s3.us-east-1.amazonaws.com/cfn-nested-aws-ec2-security-group/template.yaml"
      Parameters:
        VpcId: !GetAtt Vpc.Outputs.VPCId
        ProjectName: !Ref Project
        SecurityGroupBaseName: !Ref AppLoadBalancerSgName
        SecurityGroupDescription: "Security group for HTTP-only access"
        CiSuffix: !Ref CiSuffix
        Rule1RuleSet: "WebServer"
        Rule1SourceCidr: "0.0.0.0/0"
        Rule2RuleSet: "None"
        Rule3RuleSet: "None"
        Rule4RuleSet: "None"
        Rule5RuleSet: "None"
        Environment: !Ref Environment
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: "Implement VPC with single public subnet and EC2 SSH"
        - Key: Component
          Value: "Application Load Balancer HTTP-only Security Group"
        - Key: ManagedBy
          Value: RootStack
      TimeoutInMinutes: 10

  # Web server security group. No CIDR rules; HTTP comes only from the AppLoadBalancerSg security group
  WebServerSg:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TemplateURL: !Sub "https://${TemplateBucket}.s3.us-east-1.amazonaws.com/cfn-nested-aws-ec2-security-group/template.yaml"
      Parameters:
        VpcId: !GetAtt Vpc.Outputs.VPCId
        ProjectName: !Ref Project
        SecurityGroupBaseName: !Ref WebServerSgName
        SecurityGroupDescription: "Security group for web server HTTP access from the load balancer"
        CiSuffix: !Ref CiSuffix
        Rule1SourceSecurityGroupId: !GetAtt AppLoadBalancerSg.Outputs.SecurityGroupId
        Rule1RuleSet: "WebServer"
        Rule2RuleSet: "None"
        Rule3RuleSet: "None"
        Rule4RuleSet: "None"
        Rule5RuleSet: "None"
        Environment: !Ref Environment
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: "Implement VPC with single public subnet and EC2 SSH"
        - Key: Component
          Value: "Web Server Security Group"
        - Key: ManagedBy
          Value: RootStack
      TimeoutInMinutes: 10

  # EC2 instance in the private subnet, with the private security group and key pair
  # PrivateEc2:
  #   Type: AWS::CloudFormation::Stack
  #   DeletionPolicy: Delete
  #   UpdateReplacePolicy: Delete
  #   Properties:
  #     TemplateURL: !Sub "https://${TemplateBucket}.s3.us-east-1.amazonaws.com/cfn-nested-aws-ec2-instance/template.yaml"
  #     Parameters:
  #       ProjectName: !Ref Project
  #       InstanceBaseName: "private-ec2"
  #       Environment: !Ref Environment
  #       CiSuffix: !Ref CiSuffix
  #       ImageId: !Ref AmiParam
  #       InstanceType: !Ref InstanceType
  #       KeyName: !Ref KeyName
  #       SubnetId: !GetAtt PrivateSubnets.Outputs.SubnetId1
  #       SecurityGroupIds: !GetAtt PrivateSg.Outputs.SecurityGroupId
  #     Tags:
  #       - Key: Environment
  #         Value: !Ref Environment
  #       - Key: Project
  #         Value: "Implement VPC with single public subnet and EC2 SSH"
  #       - Key: Component
  #         Value: NetworkingEC2Instance
  #       - Key: ManagedBy
  #         Value: RootStack
  #     TimeoutInMinutes: 10

Outputs:

  VpcId:
    Description: "ID of the VPC created by the nested stack"
    Value: !GetAtt Vpc.Outputs.VPCId

  IgwId:
    Description: "ID of the Internet Gateway attached to the VPC created by the nested stack"
    Value: !GetAtt Vpc.Outputs.InternetGatewayId

  PublicSubnet1Id:
    Description: "ID of the public subnet created by the nested subnets stack"
    Value: !GetAtt PublicSubnets.Outputs.SubnetId1

  PublicSubnet2Id:
    Description: "ID of the public subnet created by the nested subnets stack"
    Value: !GetAtt PublicSubnets.Outputs.SubnetId2

  PrivateSubnetId:
    Description: "ID of the private subnet created by the nested subnets stack"
    Value: !GetAtt PrivateSubnets.Outputs.SubnetId1

  AppLoadBalancerSgId:
    Description: "ID of the Application Load Balancer security group in the public subnet"
    Value: !GetAtt AppLoadBalancerSg.Outputs.SecurityGroupId

  AppLoadBalancerSgName:
    Description: "Name of the Application Load Balancer security group in the public subnet"
    Value: !GetAtt AppLoadBalancerSg.Outputs.SecurityGroupName

  WebServerSgId:
    Description: "ID of the web server security group in the private subnet"
    Value: !GetAtt WebServerSg.Outputs.SecurityGroupId

  WebServerSgName:
    Description: "Name of the web server security group in the private subnet"
    Value: !GetAtt WebServerSg.Outputs.SecurityGroupName

  # PublicEc2Id:
  #   Description: "ID of the EC2 instance launched in the public subnet"
  #   Value: !GetAtt PublicEc2.Outputs.InstanceId

  # PrivateEc2Id:
  #   Description: "ID of the EC2 instance launched in the private subnet"
  #   Value: !GetAtt PrivateEc2.Outputs.InstanceId